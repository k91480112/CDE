<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>院所待修正事項</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f7;
      color: #202124;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .app {
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 18px;
      background: #fff;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 22px;
    }

    .status {
      padding: 22px;
      text-align: center;
      line-height: 1.7;
    }

    .box {
      margin-bottom: 12px;
      padding: 15px;
      border: 1px solid #d9dee2;
      border-radius: 9px;
    }

    .label {
      margin-bottom: 5px;
      font-size: 12px;
      color: #6b7280;
    }

    .value {
      font-size: 16px;
      font-weight: 700;
      word-break: break-all;
    }

    .error {
      display: none;
      padding: 16px;
      border: 1px solid #cfd5da;
      border-radius: 9px;
      white-space: pre-wrap;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>院所待修正事項</h1>

  <div
    id="status"
    class="status">
    步驟 1：載入 LIFF
  </div>

  <div
    id="result"
    style="display:none">

    <div class="box">
      <div class="label">
        LINE 顯示名稱
      </div>

      <div
        id="displayName"
        class="value">
      </div>
    </div>

    <div class="box">
      <div class="label">
        執行環境
      </div>

      <div
        id="environment"
        class="value">
      </div>
    </div>

    <div class="box">
      <div class="label">
        聊天來源
      </div>

      <div
        id="contextType"
        class="value">
      </div>
    </div>

    <div class="box">
      <div class="label">
        登入狀態
      </div>

      <div
        id="loginState"
        class="value">
      </div>
    </div>

    <div class="box">
      <div class="label">
        測試版本
      </div>

      <div class="value">
        GH-LIFF-TEST-02
      </div>
    </div>

  </div>

  <div
    id="error"
    class="error">
  </div>

</div>


<script>

const LIFF_ID =
  '2011620030-NYQtPNfE';


async function start() {

  const status =
    document.getElementById('status');

  const result =
    document.getElementById('result');

  const errorBox =
    document.getElementById('error');

  try {

    status.textContent =
      '步驟 2：初始化 LINE';

    await Promise.race([

      liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      }),

      new Promise(
        (_, reject) =>
          setTimeout(
            () => reject(
              new Error(
                'liff.init() 超過 15 秒'
              )
            ),
            15000
          )
      )

    ]);

    status.textContent =
      '步驟 3：確認登入狀態';

    if (!liff.isLoggedIn()) {
      throw new Error(
        'LIFF 初始化完成，但目前仍未登入 LINE。'
      );
    }

    status.textContent =
      '步驟 4：取得使用者資料';

    const profile =
      await liff.getProfile();

    const context =
      liff.getContext();

    document
      .getElementById('displayName')
      .textContent =
        profile.displayName || '無';

    document
      .getElementById('environment')
      .textContent =
        liff.isInClient()
          ? 'LINE App 內'
          : '外部瀏覽器';

    document
      .getElementById('contextType')
      .textContent =
        context && context.type
          ? context.type
          : '無聊天來源';

    document
      .getElementById('loginState')
      .textContent =
        liff.isLoggedIn()
          ? '已登入'
          : '未登入';

    status.style.display =
      'none';

    result.style.display =
      'block';

  } catch (error) {

    status.style.display =
      'none';

    errorBox.style.display =
      'block';

    errorBox.textContent =
      'LIFF 啟動失敗\n\n' +
      (
        error && error.message
          ? error.message
          : String(error)
      );
  }
}


window.addEventListener(
  'load',
  start
);

</script>

</body>
</html>
