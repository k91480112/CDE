<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>院所待修正事項</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f7;
      color: #202124;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .app {
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 18px;
      background: #fff;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 22px;
    }

    .box {
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid #d9dee2;
      border-radius: 10px;
    }

    .label {
      margin-bottom: 5px;
      font-size: 12px;
      color: #6b7280;
    }

    .value {
      font-size: 16px;
      font-weight: 700;
      word-break: break-all;
    }

    .status {
      padding: 18px;
      text-align: center;
      line-height: 1.7;
    }

    .error {
      display: none;
      padding: 16px;
      border: 1px solid #cfd5da;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #263746;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>
    院所待修正事項
  </h1>

  <div
    id="status"
    class="status">
    正在啟動 LIFF
  </div>

  <div
    id="result"
    style="display:none">

    <div class="box">
      <div class="label">
        LINE 顯示名稱
      </div>

      <div
        id="displayName"
        class="value">
      </div>
    </div>

    <div class="box">
      <div class="label">
        LIFF 執行環境
      </div>

      <div
        id="environment"
        class="value">
      </div>
    </div>

    <div class="box">
      <div class="label">
        聊天來源
      </div>

      <div
        id="contextType"
        class="value">
      </div>
    </div>

    <div class="box">
      <div class="label">
        測試版本
      </div>

      <div class="value">
        GH-LIFF-TEST-01
      </div>
    </div>

  </div>

  <div
    id="error"
    class="error">
  </div>

</div>


<script>

const LIFF_ID =
  '2011620030-NYQtPNfE';


async function start() {

  const status =
    document.getElementById(
      'status'
    );

  const result =
    document.getElementById(
      'result'
    );

  const errorBox =
    document.getElementById(
      'error'
    );


  try {

    status.textContent =
      '初始化 LINE';


    await Promise.race([

      liff.init({
        liffId: LIFF_ID
      }),

      new Promise(
        (_, reject) =>
          setTimeout(
            () =>
              reject(
                new Error(
                  'liff.init() 超過 15 秒仍未完成'
                )
              ),
            15000
          )
      )

    ]);


    status.textContent =
      '確認登入狀態';


    if (!liff.isLoggedIn()) {

      liff.login({
        redirectUri:
          window.location.href
      });

      return;
    }


    status.textContent =
      '取得 LINE 使用者資料';


    const profile =
      await liff.getProfile();


    const context =
      liff.getContext();


    document
      .getElementById(
        'displayName'
      )
      .textContent =
        profile.displayName || '無';


    document
      .getElementById(
        'environment'
      )
      .textContent =
        liff.isInClient()
          ? 'LINE App 內'
          : '外部瀏覽器';


    document
      .getElementById(
        'contextType'
      )
      .textContent =
        context &&
        context.type
          ? context.type
          : '無聊天來源';


    status.style.display =
      'none';

    result.style.display =
      'block';


  } catch (error) {

    status.style.display =
      'none';

    errorBox.style.display =
      'block';

    errorBox.textContent =
      'LIFF 啟動失敗\n\n' +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      );
  }
}


window.addEventListener(
  'load',
  start
);

</script>

</body>

</html>
