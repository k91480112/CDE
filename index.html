<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>院所待修正事項</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f6f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    #appFrame {
      display: none;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #fff;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
      z-index: 10;
    }

    .boot-box {
      width: min(380px, 92vw);
      text-align: center;
    }

    .boot-title {
      font-size: 20px;
      font-weight: 700;
    }

    .boot-text {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }

    #errorBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #d6dade;
      border-radius: 9px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .retry {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #263746;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div id="boot">

  <div class="boot-box">

    <div class="boot-title">
      院所待修正事項
    </div>

    <div
      id="bootText"
      class="boot-text">
      正在連線 LINE
    </div>

    <div id="errorBox"></div>

    <button
      id="retryButton"
      class="retry"
      style="display:none"
      onclick="location.reload()">
      重新載入
    </button>

  </div>

</div>


<iframe
  id="appFrame"
  title="院所待修正事項">
</iframe>


<script>

const LIFF_ID =
  '2011620030-NYQtPNfE';

const APP_URL =
  'https://script.google.com/macros/s/AKfycbwUjVWLmHYsccXb0TLdlKNa-sfiv4mYdlUpy6b6bFQQZyGsuwPEvQ4ZbZt-IyL6eeA0LA/exec';

const BRIDGE_VERSION =
  'CDE-BRIDGE-01';


let lineIdToken = '';

let currentContext = null;

let currentProfile = null;

let childOrigin = '';

let liffReady = false;


const appFrame =
  document.getElementById(
    'appFrame'
  );


function setBootText(text) {

  document
    .getElementById(
      'bootText'
    )
    .textContent =
      text;
}


function showFatal(message) {

  const box =
    document.getElementById(
      'errorBox'
    );

  box.style.display =
    'block';

  box.textContent =
    message;

  document
    .getElementById(
      'retryButton'
    )
    .style.display =
      'block';

  setBootText(
    '系統無法啟動'
  );
}


function isTrustedChildOrigin(origin) {

  if (
    origin ===
    'https://script.google.com'
  ) {
    return true;
  }

  try {

    const url =
      new URL(origin);

    return (
      url.protocol === 'https:' &&
      (
        url.hostname ===
          'script.googleusercontent.com' ||
        url.hostname.endsWith(
          '.googleusercontent.com'
        )
      )
    );

  } catch (error) {

    return false;
  }
}


async function initializeLiff() {

  try {

    setBootText(
      '初始化 LINE'
    );


    await Promise.race([

      liff.init({
        liffId: LIFF_ID,
        withLoginOnExternalBrowser: true
      }),

      new Promise(
        (_, reject) =>
          setTimeout(
            () =>
              reject(
                new Error(
                  'LINE 初始化超過 15 秒'
                )
              ),
            15000
          )
      )

    ]);


    if (
      !liff.isLoggedIn()
    ) {

      if (
        !liff.isInClient()
      ) {

        liff.login({
          redirectUri:
            window.location.href
        });

        return;
      }

      throw new Error(
        'LINE 尚未完成登入'
      );
    }


    setBootText(
      '取得 LINE 身分'
    );


    lineIdToken =
      liff.getIDToken();


    if (!lineIdToken) {

      throw new Error(
        '無法取得 LINE ID Token，請確認 LIFF 已啟用 openid。'
      );
    }


    try {

      currentProfile =
        await liff.getProfile();

    } catch (error) {

      currentProfile =
        null;
    }


    currentContext =
      liff.getContext();


    liffReady =
      true;


    setBootText(
      '載入院所待修正系統'
    );


    appFrame.src =
      APP_URL;

    appFrame.style.display =
      'block';


  } catch (error) {

    showFatal(
      error &&
      error.message
        ? error.message
        : String(error)
    );
  }
}


/* =========================================================
   Apps Script iframe 橋接
   ========================================================= */

window.addEventListener(
  'message',
  async event => {

    if (
      event.source !==
      appFrame.contentWindow
    ) {
      return;
    }


    const data =
      event.data || {};


    if (
      data.type ===
      'CDE_READY'
    ) {

      if (
        !isTrustedChildOrigin(
          event.origin
        )
      ) {

        console.warn(
          'Rejected child origin:',
          event.origin
        );

        return;
      }


      childOrigin =
        event.origin;


      if (
        !liffReady ||
        !lineIdToken
      ) {
        return;
      }


      appFrame.contentWindow
        .postMessage(
          {
            type:
              'CDE_AUTH',

            bridgeVersion:
              BRIDGE_VERSION,

            idToken:
              lineIdToken,

            inClient:
              liff.isInClient(),

            contextType:
              currentContext &&
              currentContext.type
                ? currentContext.type
                : '',

            displayName:
              currentProfile &&
              currentProfile.displayName
                ? currentProfile.displayName
                : ''
          },
          childOrigin
        );


      document
        .getElementById(
          'boot'
        )
        .style.display =
          'none';

      return;
    }


    if (
      !childOrigin ||
      event.origin !==
      childOrigin
    ) {
      return;
    }


    if (
      data.type ===
      'CDE_LINE_SEND'
    ) {

      await handleLineSend(
        data
      );
    }
  }
);


/* =========================================================
   LINE 群組通知
   ========================================================= */

async function handleLineSend(data) {

  const requestId =
    String(
      data.requestId || ''
    );

  const text =
    String(
      data.text || ''
    ).slice(
      0,
      5000
    );

  const allowShareFallback =
    Boolean(
      data.allowShareFallback
    );


  if (!text) {

    sendBridgeResult(
      requestId,
      false,
      'failed',
      '通知內容為空白'
    );

    return;
  }


  const messages = [
    {
      type:
        'text',

      text:
        text
    }
  ];


  try {

    const type =
      currentContext &&
      currentContext.type
        ? currentContext.type
        : '';


    if (
      liff.isInClient() &&
      type === 'group'
    ) {

      await liff.sendMessages(
        messages
      );


      sendBridgeResult(
        requestId,
        true,
        'sent',
        ''
      );

      return;
    }


    if (
      allowShareFallback &&
      typeof liff.shareTargetPicker ===
        'function'
    ) {

      await liff.shareTargetPicker(
        messages
      );


      sendBridgeResult(
        requestId,
        true,
        'shared',
        ''
      );

      return;
    }


    sendBridgeResult(
      requestId,
      false,
      'skipped',
      '目前不是從 LINE 群組開啟'
    );


  } catch (error) {

    sendBridgeResult(
      requestId,
      false,
      'failed',
      error &&
      error.message
        ? error.message
        : String(error)
    );
  }
}


function sendBridgeResult(
  requestId,
  ok,
  status,
  message
) {

  if (
    !childOrigin ||
    !appFrame.contentWindow
  ) {
    return;
  }


  appFrame.contentWindow
    .postMessage(
      {
        type:
          'CDE_LINE_RESULT',

        requestId:
          requestId,

        ok:
          ok,

        status:
          status,

        message:
          message || ''
      },
      childOrigin
    );
}


initializeLiff();

</script>

</body>
</html>
