<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>院所待修正事項</title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f6f7;
      color: #202124;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    #appFrame {
      display: none;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #fff;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
    }

    .boot-box {
      width: min(390px, 92vw);
      text-align: center;
    }

    .boot-title {
      font-size: 21px;
      font-weight: 700;
    }

    .boot-text {
      margin-top: 12px;
      color: #5f6368;
      font-size: 15px;
      line-height: 1.7;
    }

    .version {
      margin-top: 6px;
      color: #90959a;
      font-size: 11px;
    }

    #errorBox {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #d7dbdf;
      border-radius: 9px;
      background: #fafbfb;
      text-align: left;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.7;
    }

    .retry {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #263746;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

  </style>

</head>


<body>


<div id="boot">

  <div class="boot-box">

    <div class="boot-title">
      院所待修正事項
    </div>

    <div
      id="bootText"
      class="boot-text">
      正在啟動
    </div>

    <div class="version">
      CDE-BRIDGE-02
    </div>

    <div id="errorBox"></div>

    <button
      id="retryButton"
      class="retry"
      onclick="location.reload()">
      重新載入
    </button>

  </div>

</div>


<iframe
  id="appFrame"
  title="院所待修正事項">
</iframe>


<script>

/* =========================================================
   基本設定
   ========================================================= */

const LIFF_ID =
  '2011620030-NYQtPNfE';


const APP_URL =
  'https://script.google.com/macros/s/AKfycbwUjVWLmHYsccXb0TLdlKNa-sfiv4mYdlUpy6b6bFQQZyGsuwPEvQ4ZbZt-IyL6eeA0LA/exec';


const BRIDGE_VERSION =
  'CDE-BRIDGE-02';


const appFrame =
  document.getElementById(
    'appFrame'
  );


let lineIdToken =
  '';


let currentContext =
  null;


let currentProfile =
  null;


let liffReady =
  false;


/*
  注意：
  Apps Script HTML Service 實際可能再包一層
  Google sandbox iframe。

  因此不能假設真正傳訊息的 window
  就是 appFrame.contentWindow。
*/

let childOrigin =
  '';


let childWindow =
  null;


let systemReadyTimer =
  null;


/* =========================================================
   啟動畫面
   ========================================================= */

function setBootText(
  text
) {

  document
    .getElementById(
      'bootText'
    )
    .textContent =
      text;
}


function showFatal(
  message
) {

  if (
    systemReadyTimer
  ) {

    clearTimeout(
      systemReadyTimer
    );

    systemReadyTimer =
      null;
  }


  const errorBox =
    document.getElementById(
      'errorBox'
    );


  errorBox.style.display =
    'block';


  errorBox.textContent =
    message;


  document
    .getElementById(
      'retryButton'
    )
    .style.display =
      'block';


  setBootText(
    '系統無法啟動'
  );
}


function finishBoot() {

  if (
    systemReadyTimer
  ) {

    clearTimeout(
      systemReadyTimer
    );

    systemReadyTimer =
      null;
  }


  document
    .getElementById(
      'boot'
    )
    .style.display =
      'none';


  appFrame.style.display =
    'block';
}


/* =========================================================
   Google iframe Origin 驗證
   ========================================================= */

function isTrustedChildOrigin(
  origin
) {

  try {

    const url =
      new URL(
        origin
      );


    if (
      url.protocol !==
      'https:'
    ) {

      return false;
    }


    if (
      url.hostname ===
      'script.google.com'
    ) {

      return true;
    }


    if (
      url.hostname ===
      'script.googleusercontent.com'
    ) {

      return true;
    }


    if (
      url.hostname.endsWith(
        '.googleusercontent.com'
      )
    ) {

      return true;
    }


    return false;


  } catch (error) {

    return false;
  }
}


/* =========================================================
   LIFF 初始化
   ========================================================= */

async function initializeLiff() {

  try {

    setBootText(
      '初始化 LINE'
    );


    await Promise.race([

      liff.init({
        liffId:
          LIFF_ID,

        withLoginOnExternalBrowser:
          true
      }),


      new Promise(
        (_, reject) => {

          setTimeout(
            () => {

              reject(
                new Error(
                  'LINE 初始化超過 15 秒'
                )
              );

            },
            15000
          );
        }
      )

    ]);


    if (
      !liff.isLoggedIn()
    ) {

      if (
        !liff.isInClient()
      ) {

        setBootText(
          '準備登入 LINE'
        );


        liff.login();

        return;
      }


      throw new Error(
        'LINE App 內尚未完成登入'
      );
    }


    setBootText(
      '取得 LINE 身分'
    );


    lineIdToken =
      liff.getIDToken();


    if (
      !lineIdToken
    ) {

      throw new Error(
        '無法取得 LINE ID Token。\n\n請確認 LIFF App 已開啟 openid 權限。'
      );
    }


    try {

      currentProfile =
        await liff.getProfile();

    } catch (error) {

      currentProfile =
        null;
    }


    currentContext =
      liff.getContext();


    liffReady =
      true;


    setBootText(
      '載入院所待修正系統'
    );


    /*
      先顯示 iframe，但仍由 boot 蓋住。
      等內頁真正驗證成功才拿掉 boot。
    */

    appFrame.style.display =
      'block';


    appFrame.src =
      APP_URL;


    systemReadyTimer =
      setTimeout(
        () => {

          showFatal(
            '院所待修正系統載入超過 25 秒。\n\n' +
            'LINE 已完成登入，但 Apps Script 內頁沒有完成連線。\n\n' +
            '請確認 Apps Script 已重新部署最新版本。'
          );

        },
        25000
      );


  } catch (error) {

    showFatal(
      error &&
      error.message
        ? error.message
        : String(error)
    );
  }
}


/* =========================================================
   Apps Script Bridge
   ========================================================= */

window.addEventListener(
  'message',
  async event => {

    const data =
      event.data || {};


    /*
      第一次 CDE_READY：
      這裡不檢查 appFrame.contentWindow。

      因為真正發送 CDE_READY 的可能是
      Apps Script 裡面的 Google sandbox iframe。
    */

    if (
      data.type ===
      'CDE_READY'
    ) {

      if (
        !isTrustedChildOrigin(
          event.origin
        )
      ) {

        console.warn(
          'Rejected CDE_READY origin:',
          event.origin
        );

        return;
      }


      if (
        !event.source
      ) {

        return;
      }


      childOrigin =
        event.origin;


      childWindow =
        event.source;


      if (
        !liffReady ||
        !lineIdToken
      ) {

        return;
      }


      setBootText(
        '驗證 LINE 身分'
      );


      childWindow
        .postMessage(
          {
            type:
              'CDE_AUTH',

            bridgeVersion:
              BRIDGE_VERSION,

            idToken:
              lineIdToken,

            inClient:
              liff.isInClient(),

            contextType:
              currentContext &&
              currentContext.type
                ? currentContext.type
                : '',

            displayName:
              currentProfile &&
              currentProfile.displayName
                ? currentProfile.displayName
                : ''
          },
          childOrigin
        );


      return;
    }


    /*
      CDE_READY 之後，
      只接受同一個 Google iframe 的訊息。
    */

    if (
      !childWindow ||
      !childOrigin
    ) {

      return;
    }


    if (
      event.source !==
      childWindow
    ) {

      return;
    }


    if (
      event.origin !==
      childOrigin
    ) {

      return;
    }


    /*
      Apps Script：
      LINE 身分與案件資料全部讀取成功
    */

    if (
      data.type ===
      'CDE_AUTH_OK'
    ) {

      finishBoot();

      return;
    }


    /*
      Apps Script 驗證失敗
    */

    if (
      data.type ===
      'CDE_AUTH_ERROR'
    ) {

      showFatal(
        String(
          data.message ||
          '院所待修正系統驗證失敗'
        )
      );

      return;
    }


    /*
      Apps Script 要求 LINE 發訊息
    */

    if (
      data.type ===
      'CDE_LINE_SEND'
    ) {

      await handleLineSend(
        data
      );

      return;
    }
  }
);


/* =========================================================
   LINE 群組訊息
   ========================================================= */

async function handleLineSend(
  data
) {

  const requestId =
    String(
      data.requestId ||
      ''
    );


  const text =
    String(
      data.text ||
      ''
    ).slice(
      0,
      5000
    );


  const allowShareFallback =
    Boolean(
      data.allowShareFallback
    );


  if (!text) {

    sendBridgeResult(
      requestId,
      false,
      'failed',
      'LINE 訊息內容為空白'
    );

    return;
  }


  const messages = [
    {
      type:
        'text',

      text:
        text
    }
  ];


  try {

    const contextType =
      currentContext &&
      currentContext.type
        ? currentContext.type
        : '';


    /*
      從 LINE 群組內開啟：
      直接傳回目前群組
    */

    if (
      liff.isInClient() &&
      contextType ===
        'group'
    ) {

      await liff.sendMessages(
        messages
      );


      sendBridgeResult(
        requestId,
        true,
        'sent',
        ''
      );


      return;
    }


    /*
      非群組情境：
      每日總結等功能可使用分享選擇器
    */

    if (
      allowShareFallback &&
      typeof liff.shareTargetPicker ===
        'function'
    ) {

      await liff.shareTargetPicker(
        messages
      );


      sendBridgeResult(
        requestId,
        true,
        'shared',
        ''
      );


      return;
    }


    sendBridgeResult(
      requestId,
      false,
      'skipped',
      '目前不是從 LINE 群組開啟'
    );


  } catch (error) {

    sendBridgeResult(
      requestId,
      false,
      'failed',
      error &&
      error.message
        ? error.message
        : String(error)
    );
  }
}


/* =========================================================
   回覆 Apps Script iframe
   ========================================================= */

function sendBridgeResult(
  requestId,
  ok,
  status,
  message
) {

  if (
    !childWindow ||
    !childOrigin
  ) {

    return;
  }


  childWindow
    .postMessage(
      {
        type:
          'CDE_LINE_RESULT',

        requestId:
          requestId,

        ok:
          Boolean(ok),

        status:
          String(
            status ||
            ''
          ),

        message:
          String(
            message ||
            ''
          )
      },
      childOrigin
    );
}


/* =========================================================
   Start
   ========================================================= */

initializeLiff();

</script>

</body>

</html>
